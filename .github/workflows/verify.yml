name: Verify site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SITE_BUILD_REVISION: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify generated site
        run: pnpm verify:site

      - name: Run browser suite
        run: pnpm exec playwright test

      - name: Package verified static output
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -Eeuo pipefail
          readonly package_dir="${RUNNER_TEMP}/personal-site-package"
          readonly archive="${GITHUB_SHA}.tar.gz"
          readonly source_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"

          install -d -m 0700 "${package_dir}"
          tar \
            --sort=name \
            --mtime="@${source_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='u=rwX,go=rX' \
            --format=gnu \
            --directory=dist \
            --create \
            --file=- \
            . | gzip --no-name --best >"${package_dir}/${archive}"
          (
            cd "${package_dir}"
            sha256sum "${archive}" >"${archive}.sha256"
          )

      - name: Retain verified site package
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: personal-site-${{ github.sha }}
          path: |
            ${{ runner.temp }}/personal-site-package/${{ github.sha }}.tar.gz
            ${{ runner.temp }}/personal-site-package/${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: true
